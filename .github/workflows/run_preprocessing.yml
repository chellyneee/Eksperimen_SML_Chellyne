name: Data Preprocessing Automation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Execute Preprocessing Script
        run: |
          cd preprocessing
          python automate_chellyne.py

      - name: Commit and Push Preprocessed Data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add preprocessing/namadataset_preprocessing/tourism_preprocessed.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: preprocessed dataset" && git push)
